name: CI

on:
  push:
    branches: [develop, release]
    paths:
      - '**.py'
      - '**.md'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'docs/**'
  pull_request:
    branches: [develop, release]
    paths:
      - '**.py'
      - '**.md'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'docs/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    timeout-minutes: 15
    strategy:
      matrix:
        os: ["ubuntu-latest", "windows-latest"]  # Remove MacOS (billing + github.com/ThalesGroup/scio/issues/2)
        python-version: ["3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install uv and set python version
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.8.17"
          python-version: ${{ matrix.python-version }}

      - name: Run ruff
        run: |
          uvx -v ruff check
          uvx -v ruff format --diff

      - name: Run mypy
        run: |
          uv -v run --group=doc mypy

      - name: Build & Install
        run: |
          uv -v build
          uv -v pip install dist/scio_pypi-1.1.1.dev0-py3-none-any.whl

      - name: Build docs (Posix)
        if: matrix.os != 'windows-latest'
        env:
          SPHINXOPTS: --fail-on-warning
        run: |
          uv -v run --group=doc make -C docs

      - name: Build docs (Windows)
        if: matrix.os == 'windows-latest'
        env:
          SPHINXOPTS: --fail-on-warning
        run: |
          uv -v run --group=doc cmd /c "docs\\make.bat"

      - name: Run pytest
        id: run-pytest
        continue-on-error: true
        run: |
          uv -v run pytest -vv --cov-report=xml

      - name: Upload observed plots on failure
        if: ${{ steps.run-pytest.outcome == 'failure' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pytest-observed-${{ matrix.os }}-py${{ matrix.python-version }}
          path: test/expected/*/*.observed.*
          retention-days: 30

      - name: Fail the job if pytest failed
        if: ${{ steps.run-pytest.outcome == 'failure' }}
        run: exit 1

      - name: Upload coverage report to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14'
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true

